<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲內容編輯器 — Learn How to Love Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ee;
      --panel: #fff;
      --border: #e0d6c8;
      --accent: #8b6914;
      --accent-soft: #f0e6d0;
      --text: #2c2419;
      --muted: #6b5f52;
      --changed: #c45c26;
      --readonly: #9a9085;
      --nav-w: 280px;
      --preview-bg: #faf8f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      padding: 0.75rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(44, 36, 25, 0.06);
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .topbar .links { font-size: 0.85rem; color: var(--muted); }
    .topbar .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button, .btn {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button:hover { filter: brightness(0.97); }
    .layout {
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      min-height: calc(100vh - 56px);
    }
    nav#toc {
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow: auto;
      padding: 1rem;
      background: #f0ebe3;
      border-right: 1px solid var(--border);
    }
    nav#toc h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    nav#toc input {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }
    .toc-group { margin-bottom: 1rem; }
    .toc-group-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .toc-link {
      display: block;
      font-size: 0.82rem;
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
      text-decoration: none;
      color: var(--text);
    }
    .toc-link:hover, .toc-link.active { background: var(--accent-soft); }
    .toc-link.changed::after { content: ' ●'; color: var(--changed); font-size: 0.65rem; }
    main#content { padding: 1.25rem 1.5rem 3rem; max-width: 920px; }
    .hint-box {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .hint-box code { background: rgba(255,255,255,0.6); padding: 0.1rem 0.35rem; border-radius: 4px; }
    .preview-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    .preview-controls label { display: flex; align-items: center; gap: 0.35rem; }
    section.scene-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.25rem;
      scroll-margin-top: 72px;
    }
    section.scene-block h3 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
    }
    .scene-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }
    .field-block {
      border-top: 1px dashed var(--border);
      padding-top: 0.85rem;
      margin-top: 0.85rem;
      scroll-margin-top: 72px;
    }
    .field-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }
    .field-head .label { font-weight: 600; font-size: 0.92rem; }
    .field-head .tag {
      font-size: 0.72rem;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: #eee8df;
      color: var(--muted);
    }
    .field-head .tag.readonly { background: #ece9e5; color: var(--readonly); }
    .field-head .tag.changed { background: #fde8dc; color: var(--changed); }
    .field-head .anchor-link {
      margin-left: auto;
      font-size: 0.78rem;
      text-decoration: none;
    }
    textarea.field-input {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      font: inherit;
      line-height: 1.65;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    textarea.field-input:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    textarea.field-input[readonly] {
      background: #f5f2ed;
      color: var(--readonly);
    }
    textarea.field-input-fn {
      min-height: 14rem;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .field-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.45rem 0;
    }
    .field-tools button { font-size: 0.78rem; padding: 0.25rem 0.55rem; }
    .preview {
      background: var(--preview-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      margin-top: 0.45rem;
      white-space: pre-line;
      font-size: 0.95rem;
      min-height: 2.5rem;
    }
    .preview.sub { color: var(--muted); font-size: 0.88rem; }
    .preview.empty { color: #aaa; font-style: italic; }
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem 1rem;
      background: rgba(44, 36, 25, 0.92);
      color: #f7f3ee;
      font-size: 0.82rem;
      display: flex;
      gap: 1rem;
      z-index: 30;
    }
    .load-error {
      padding: 2rem;
      color: #a33;
      max-width: 640px;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      nav#toc {
        position: relative;
        top: 0;
        height: auto;
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>遊戲內容編輯器</h1>
    <span class="links">
      <a href="index.html">← 回遊戲</a>
      · <a href="啟動編輯器.bat" title="若無法儲存請雙擊此檔">啟動編輯器.bat</a>
    </span>
    <div class="actions">
      <button type="button" id="btn-reconnect">重新連線</button>
      <button type="button" id="btn-reload">重新載入</button>
      <button type="button" id="btn-draft-save">儲存草稿</button>
      <button type="button" id="btn-draft-load">載入草稿</button>
      <button type="button" class="primary" id="btn-save-js">儲存到遊戲檔案</button>
    </div>
  </header>

  <div class="layout">
    <nav id="toc" aria-label="內容目錄">
      <h2>快速連結</h2>
      <input type="search" id="toc-search" placeholder="搜尋場景或文字…" autocomplete="off">
      <div id="toc-list"></div>
    </nav>
    <main id="content">
      <div id="load-placeholder" class="hint-box">正在載入遊戲資料…</div>
    </main>
  </div>

  <div class="status-bar" id="status-bar" hidden>
    <span id="status-changed">已修改 0 處</span>
    <span id="status-draft"></span>
  </div>

  <script>
    const DRAFT_KEY = 'lhtl_game_editor_draft_v1';
    const PREVIEW_STATE = { day: 1, dogName: '豆花', dogGender: 'female', flags: {}, memories: [] };

    /** @type {Map<string, {id:string, file:string, original:string, value:string, meta:object}>} */
    const fields = new Map();
    let sourceFiles = {};
    let serverCanSave = false;
    const API_PORT = 8765;
    const RESULT_PORT = 8769;

    function apiBase() {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        return `${location.protocol}//${location.host}`;
      }
      return `http://127.0.0.1:${API_PORT}`;
    }

    function updateServerStatus() {
      const statusEl = document.getElementById('status-draft');
      const bar = document.getElementById('status-bar');
      bar.hidden = false;
      if (location.protocol === 'file:') {
        statusEl.textContent = `請雙擊 Demo 資料夾內的「啟動編輯器.bat」（勿用 file:// 開啟）`;
        return;
      }
      if (serverCanSave) {
        statusEl.textContent = `已連線 ${apiBase()} · 可直接儲存`;
      } else {
        statusEl.textContent = `未連線 · 請雙擊「啟動編輯器.bat」後按「重新連線」`;
      }
    }

    async function checkEditorApi() {
      try {
        const res = await fetch(`${apiBase()}/api/editor`, { cache: 'no-store' });
        if (!res.ok) return false;
        const data = await res.json();
        serverCanSave = !!data.save;
        updateServerStatus();
        return serverCanSave;
      } catch {
        serverCanSave = false;
        updateServerStatus();
        return false;
      }
    }

    async function waitServerBack(attempts = 30) {
      for (let i = 0; i < attempts; i++) {
        await new Promise((r) => setTimeout(r, 400));
        if (await checkEditorApi()) return true;
      }
      return false;
    }

    function fieldId(...parts) {
      return parts.join('--');
    }

    function resolveValue(val, state = PREVIEW_STATE) {
      if (val == null) return '';
      if (typeof val === 'function') {
        try { return String(val(state) ?? ''); } catch { return ''; }
      }
      if (Array.isArray(val)) return val.join('、');
      return String(val);
    }

    function isComplexFunction(fn) {
      if (typeof fn !== 'function') return false;
      const src = fn.toString();
      return /\bif\s*\(|\bswitch\s*\(|flags\.|tier|gentle|clerkReply|pickLine/.test(src);
    }

    function skipJsString(src, i) {
      const quote = src[i];
      i += 1;
      while (i < src.length) {
        if (src[i] === '\\') { i += 2; continue; }
        if (src[i] === quote) return i + 1;
        i += 1;
      }
      return src.length;
    }

    function findBraceBlockEnd(src, openPos) {
      let depth = 0;
      let i = openPos;
      while (i < src.length) {
        const ch = src[i];
        if (ch === "'" || ch === '"' || ch === '`') {
          i = skipJsString(src, i);
          continue;
        }
        if (ch === '{') depth += 1;
        else if (ch === '}') {
          depth -= 1;
          if (depth === 0) return i + 1;
        }
        i += 1;
      }
      return null;
    }

    function unescapeJsSingle(s) {
      return s.replace(/\\n/g, '\n').replace(/\\'/g, "'").replace(/\\\\/g, '\\');
    }

    function unescapeJsTemplate(s) {
      return s.replace(/\\n/g, '\n').replace(/\\`/g, '`').replace(/\\\$/g, '$');
    }

    function escapeJsSingle(s) {
      return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    function escapeJsTemplate(s) {
      return s.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\n/g, '\\n');
    }

    function extractSceneTextFnSource(sceneId) {
      const src = sourceFiles['scenes.js'];
      if (!src) return null;
      const m = new RegExp(`\\b${sceneId}:\\s*\\{`).exec(src);
      if (!m) return null;
      const sceneOpen = src.indexOf('{', m.index);
      const sceneEnd = findBraceBlockEnd(src, sceneOpen);
      if (!sceneEnd) return null;
      const block = src.slice(m.index, sceneEnd);
      const textM = block.match(/\btext:\s*(\([^)]*\)\s*=>\s*\{)/);
      if (!textM) return null;
      const fnOpen = block.indexOf('{', block.indexOf(textM[0]));
      const fnEnd = findBraceBlockEnd(block, fnOpen);
      if (!fnEnd) return null;
      const fnStart = block.indexOf('text:') + 'text:'.length;
      return block.slice(fnStart, fnEnd).trim();
    }

    function parseIfReturn(fnSrc, cond, key, label) {
      const re = new RegExp(`if \\(${cond}\\)\\s*\\{[\\s\\n]*return \`([\\s\\S]*?)\`;`);
      const m = fnSrc.match(re);
      return m ? { key, label, value: unescapeJsTemplate(m[1]) } : null;
    }

    function parseLastReturn(fnSrc) {
      const matches = [...fnSrc.matchAll(/return `([\s\S]*?)`;/g)];
      if (!matches.length) return null;
      const m = matches[matches.length - 1];
      return unescapeJsTemplate(m[1]);
    }

    /** 含條件分支的主敘事：拆成多欄可編輯 */
    const COMPLEX_TEXT = {
      day2_petshop_after: {
        parse(fnSrc) {
          const parts = [];
          const goodM = fnSrc.match(/if \(tier === 'perfect' \|\| tier === 'good'\)[\s\S]*?pickLine = '((?:\\.|[^'\\])*)'/);
          if (goodM) parts.push({ key: 'pickGood', label: '店員評價（挑選佳）', value: unescapeJsSingle(goodM[1]) });
          const partialM = fnSrc.match(/else if \(tier === 'partial'\)[\s\S]*?pickLine = '((?:\\.|[^'\\])*)'/);
          if (partialM) parts.push({ key: 'pickPartial', label: '店員評價（部分）', value: unescapeJsSingle(partialM[1]) });
          const missM = fnSrc.match(/else if \(tier === 'miss'\)[\s\S]*?pickLine = '((?:\\.|[^'\\])*)'/);
          if (missM) parts.push({ key: 'pickMiss', label: '店員評價（失手）', value: unescapeJsSingle(missM[1]) });
          const gentleM = fnSrc.match(/\$\{gentle \? '((?:\\.|[^'\\])*)'/);
          if (gentleM) parts.push({ key: 'gentleLine', label: '追加句（dryGentle 時）', value: unescapeJsSingle(gentleM[1]) });
          const retM = fnSrc.match(/return `([\s\S]*?)`;\s*\}/);
          if (retM) {
            const raw = retM[1];
            const headEnd = raw.indexOf('${gentle');
            const tailStart = raw.indexOf('${pickLine}');
            if (headEnd > 0) parts.unshift({ key: 'head', label: '主文開頭（結帳～你穩）', value: unescapeJsTemplate(raw.slice(0, headEnd)) });
            if (tailStart >= 0) {
              parts.push({ key: 'tail', label: '主文結尾（食盆～名字）', value: unescapeJsTemplate(raw.slice(tailStart + '${pickLine}'.length)) });
            }
          }
          return parts;
        },
        build(parts) {
          const h = escapeJsTemplate(parts.head || '');
          const t = escapeJsTemplate(parts.tail || '');
          const g = escapeJsSingle(parts.gentleLine || '');
          const pg = escapeJsSingle(parts.pickGood || '');
          const pp = escapeJsSingle(parts.pickPartial || '');
          const pm = escapeJsSingle(parts.pickMiss || '');
          return `(s) => {
      const gentle = s.flags.dryGentle;
      const tier = s.flags.shopTier;
      let pickLine = '';
      if (tier === 'perfect' || tier === 'good') {
        pickLine = '${pg}';
      } else if (tier === 'partial') {
        pickLine = '${pp}';
      } else if (tier === 'miss') {
        pickLine = '${pm}';
      }
      return \`${h}\${gentle ? '${g}' : ''}\${pickLine}${t}\`;
    }`;
        },
      },

      day2_return: {
        parse(fnSrc) {
          const parts = [];
          const maleM = fnSrc.match(/=== 'male'\s*\?\s*'((?:\\.|[^'\\])*)'/);
          const femaleM = fnSrc.match(/=== 'female'\s*\?\s*'((?:\\.|[^'\\])*)'/);
          if (maleM) parts.push({ key: 'clerkMale', label: '店員回應（弟弟）', value: unescapeJsSingle(maleM[1]) });
          if (femaleM) parts.push({ key: 'clerkFemale', label: '店員回應（妹妹）', value: unescapeJsSingle(femaleM[1]) });
          const bodyM = fnSrc.match(/return `\$\{clerkReply\}([\s\S]*?)`;/);
          if (bodyM) parts.push({ key: 'body', label: '主文（進門後）', value: unescapeJsTemplate(bodyM[1]) });
          return parts;
        },
        build(parts) {
          const cm = escapeJsSingle(parts.clerkMale || '');
          const cf = escapeJsSingle(parts.clerkFemale || '');
          const b = escapeJsTemplate(parts.body || '');
          return `(s) => {
      const clerkReply = s.dogGender === 'male'
        ? '${cm}'
        : s.dogGender === 'female'
          ? '${cf}'
          : '';
      return \`\${clerkReply}${b}\`;
    }`;
        },
      },

      day3_leave_early: {
        parse(fnSrc) {
          const parts = [];
          const leadM = fnSrc.match(/const lead = asked\s*\?\s*'((?:\\.|[^'\\])*)'\s*:\s*'((?:\\.|[^'\\])*)'/);
          if (leadM) {
            parts.push({ key: 'leadAsked', label: '開場（有請假）', value: unescapeJsSingle(leadM[1]) });
            parts.push({ key: 'leadSilent', label: '開場（沒多解釋）', value: unescapeJsSingle(leadM[2]) });
          }
          const tailM = fnSrc.match(/return `\$\{lead\}([\s\S]*?)`;/);
          if (tailM) parts.push({ key: 'tail', label: '主文（回家路上）', value: unescapeJsTemplate(tailM[1]) });
          return parts;
        },
        build(parts) {
          const la = escapeJsSingle(parts.leadAsked || '');
          const ls = escapeJsSingle(parts.leadSilent || '');
          const t = escapeJsTemplate(parts.tail || '');
          return `(s) => {
      const asked = s.flags.day3AskedLeave;
      const lead = asked
        ? '${la}'
        : '${ls}';
      return \`\${lead}${t}\`;
    }`;
        },
      },

      day4_vet_intake: {
        parse(fnSrc) {
          const parts = [];
          const noteM = fnSrc.match(/=== 'honest'\s*\?\s*'((?:\\.|[^'\\])*)'\s*:\s*'((?:\\.|[^'\\])*)'/);
          if (noteM) {
            parts.push({ key: 'noteHonest', label: '醫師回應（詳填表）', value: unescapeJsSingle(noteM[1]) });
            parts.push({ key: 'noteBrief', label: '醫師回應（簡填表）', value: unescapeJsSingle(noteM[2]) });
          }
          const retM = fnSrc.match(/return `([\s\S]*?)`;\s*\}/);
          if (retM) {
            const raw = retM[1];
            const mid = raw.indexOf('${formNote}');
            if (mid >= 0) {
              parts.unshift({ key: 'head', label: '主文開頭（診間）', value: unescapeJsTemplate(raw.slice(0, mid)) });
              parts.push({ key: 'tail', label: '主文結尾（袖口）', value: unescapeJsTemplate(raw.slice(mid + '${formNote}'.length)) });
            }
          }
          return parts;
        },
        build(parts) {
          const nh = escapeJsSingle(parts.noteHonest || '');
          const nb = escapeJsSingle(parts.noteBrief || '');
          const h = escapeJsTemplate(parts.head || '');
          const t = escapeJsTemplate(parts.tail || '');
          return `(s) => {
      const formNote = s.flags.vetFormDetail === 'honest'
        ? '${nh}'
        : '${nb}';
      return \`${h}\${formNote}${t}\`;
    }`;
        },
      },

      day4_vet: {
        parse(fnSrc) {
          const parts = [];
          const leadBlock = fnSrc.match(/const lead =[\s\S]*?;/);
          if (leadBlock) {
            const strings = [...leadBlock[0].matchAll(/'((?:\\.|[^'\\])*)'/g)].map((m) => unescapeJsSingle(m[1]));
            if (strings[0]) parts.push({ key: 'leadOpen', label: '醫師開場（坦白）', value: strings[0] });
            if (strings[1]) parts.push({ key: 'leadFocus', label: '醫師開場（疫苗優先）', value: strings[1] });
            if (strings[2]) parts.push({ key: 'leadTrust', label: '醫師開場（依檢查）', value: strings[2] });
          }
          const retM = fnSrc.match(/return `\$\{lead\}([\s\S]*?)`;/);
          if (retM) parts.push({ key: 'body', label: '主文（檢查過程）', value: unescapeJsTemplate(retM[1]) });
          return parts;
        },
        build(parts) {
          const lo = escapeJsSingle(parts.leadOpen || '');
          const lf = escapeJsSingle(parts.leadFocus || '');
          const lt = escapeJsSingle(parts.leadTrust || '');
          const b = escapeJsTemplate(parts.body || '');
          return `(s) => {
      const lead = s.flags.vetIntakeTier === 'open'
        ? '${lo}'
        : s.flags.vetIntakeTier === 'focus'
          ? '${lf}'
          : '${lt}';
      return \`\${lead}${b}\`;
    }`;
        },
      },

      day4_vet_bill: {
        parse(fnSrc) {
          const parts = [];
          const extraM = fnSrc.match(/tier === 'perfect' \|\| tier === 'good'\s*\?\s*'((?:\\.|[^'\\])*)'\s*:\s*'((?:\\.|[^'\\])*)'/);
          if (extraM) {
            parts.push({ key: 'extraGood', label: '結帳說明（佳績）', value: unescapeJsSingle(extraM[1]) });
            parts.push({ key: 'extraOther', label: '結帳說明（其他）', value: unescapeJsSingle(extraM[2]) });
          }
          const retM = fnSrc.match(/return `([\s\S]*?)`;\s*\}/);
          if (retM) {
            const raw = retM[1];
            const mid = raw.indexOf('${extra}');
            if (mid >= 0) {
              parts.unshift({ key: 'head', label: '主文開頭（結帳）', value: unescapeJsTemplate(raw.slice(0, mid)) });
              parts.push({ key: 'tail', label: '主文結尾（臂彎）', value: unescapeJsTemplate(raw.slice(mid + '${extra}'.length)) });
            }
          }
          return parts;
        },
        build(parts) {
          const eg = escapeJsSingle(parts.extraGood || '');
          const eo = escapeJsSingle(parts.extraOther || '');
          const h = escapeJsTemplate(parts.head || '');
          const t = escapeJsTemplate(parts.tail || '');
          return `(s) => {
      const tier = s.flags.vetTier;
      const extra = tier === 'perfect' || tier === 'good'
        ? '${eg}'
        : '${eo}';
      return \`${h}\${extra}${t}\`;
    }`;
        },
      },

      day5_home_after: {
        parse(fnSrc) {
          const parts = [];
          const good = parseIfReturn(fnSrc, "tier === 'perfect' \\|\\| tier === 'good'", 'tierGood', '主文（認家佳績）');
          const partial = parseIfReturn(fnSrc, "tier === 'partial'", 'tierPartial', '主文（部分認得）');
          if (good) parts.push(good);
          if (partial) parts.push(partial);
          const fallback = parseLastReturn(fnSrc);
          if (fallback) parts.push({ key: 'tierMiss', label: '主文（認得較少）', value: fallback });
          return parts;
        },
        build(parts) {
          const g = escapeJsTemplate(parts.tierGood || '');
          const p = escapeJsTemplate(parts.tierPartial || '');
          const m = escapeJsTemplate(parts.tierMiss || '');
          return `(s) => {
      const tier = s.flags.homeExploreTier;
      if (tier === 'perfect' || tier === 'good') {
        return \`${g}\`;
      }
      if (tier === 'partial') {
        return \`${p}\`;
      }
      return \`${m}\`;
    }`;
        },
      },

      day6_thunder_after: {
        parse(fnSrc) {
          const parts = [];
          const perfect = parseIfReturn(fnSrc, "tier === 'perfect'", 'tierPerfect', '主文（安撫完美）');
          const good = parseIfReturn(fnSrc, "tier === 'good'", 'tierGood', '主文（安撫良好）');
          const partial = parseIfReturn(fnSrc, "tier === 'miss' \\|\\| tier === 'partial'", 'tierPartial', '主文（部分失手）');
          if (perfect) parts.push(perfect);
          if (good) parts.push(good);
          if (partial) parts.push(partial);
          const fallback = parseLastReturn(fnSrc);
          if (fallback) parts.push({ key: 'tierDefault', label: '主文（預設）', value: fallback });
          return parts;
        },
        build(parts) {
          const tp = escapeJsTemplate(parts.tierPerfect || '');
          const tg = escapeJsTemplate(parts.tierGood || '');
          const tpa = escapeJsTemplate(parts.tierPartial || '');
          const td = escapeJsTemplate(parts.tierDefault || '');
          return `(s) => {
      const tier = s.flags.thunderComfortTier;
      const name = dogLabel(s);
      if (tier === 'perfect') {
        return \`${tp}\`;
      }
      if (tier === 'good') {
        return \`${tg}\`;
      }
      if (tier === 'miss' || tier === 'partial') {
        return \`${tpa}\`;
      }
      return \`${td}\`;
    }`;
        },
      },
    };

    function appendComplexTextFields(section, dayDiv, blockId, scene) {
      const fnSrc = extractSceneTextFnSource(scene.id);
      if (!fnSrc) return false;

      const spec = COMPLEX_TEXT[scene.id];
      let parts = spec ? spec.parse(fnSrc) : [];

      if (!parts.length) {
        const partFid = registerField(fieldId(blockId, 'text', '__fn__'), 'scenes.js', fnSrc, {
          sceneId: scene.id,
          prop: 'text',
          isComplexText: true,
          complexScene: scene.id,
          textPart: '__fn__',
        });
        const ta = buildFieldBlock(partFid, '主敘事 text（條件分支 · 進階）', '主敘事', fnSrc, true, false);
        ta.querySelector('textarea')?.classList.add('field-input-fn');
        section.appendChild(ta);
        dayDiv.appendChild(buildTocEntry(blockId, `　↳ 主敘事（分支）`));
        return true;
      }

      parts.forEach((part) => {
        const partFid = registerField(fieldId(blockId, 'text', part.key), 'scenes.js', part.value, {
          sceneId: scene.id,
          prop: 'text',
          isComplexText: true,
          complexScene: scene.id,
          textPart: part.key,
        });
        section.appendChild(buildFieldBlock(partFid, `主敘事 · ${part.label}`, '主敘事', part.value, true, false));
        dayDiv.appendChild(buildTocEntry(partFid, `　↳ ${part.label.slice(0, 14)}`));
      });
      return true;
    }

    function buildComplexTextFunction(sceneId, parts) {
      if (parts.__fn__ != null) return parts.__fn__;
      const spec = COMPLEX_TEXT[sceneId];
      if (!spec) return parts.__fn__ || '';
      const converted = {};
      Object.entries(parts).forEach(([k, v]) => {
        converted[k] = displayToSource(v, PREVIEW_STATE);
      });
      return spec.build(converted);
    }

    function gatherComplexTextParts(sceneId) {
      const parts = {};
      fields.forEach((f) => {
        if (f.meta.complexScene === sceneId && f.meta.textPart) {
          parts[f.meta.textPart] = f.value;
        }
      });
      return parts;
    }

    function complexTextHasChanges(sceneId) {
      return [...fields.values()].some(
        (f) => f.meta.complexScene === sceneId && f.meta.textPart && f.value !== f.original,
      );
    }

    function renderPreview(text, isSub) {
      const el = document.createElement('div');
      el.className = 'preview' + (isSub ? ' sub' : '') + (!text ? ' empty' : '');
      el.textContent = text || '（空白）';
      return el;
    }

    function displayToSource(text, state) {
      let out = text;
      const name = dogLabel(state);
      if (name && name !== '牠') {
        out = out.split(name).join('${dogLabel(s)}');
      }
      const pron = dogPronoun(state);
      if (pron !== '牠') {
        out = out.split(pron).join('${dogPronoun(s)}');
        const poss = pron === '她' ? '她的' : '他的';
        out = out.split(poss).join('${dogPronoun(s)}的');
      }
      return out;
    }

    function needsTemplate(sourceText) {
      return sourceText.includes('${');
    }

    function registerField(id, file, original, meta = {}) {
      const value = original;
      fields.set(id, { id, file, original, value, meta });
      return id;
    }

    function markChanged(id) {
      const f = fields.get(id);
      if (!f) return;
      f.value = document.querySelector(`[data-field-id="${id}"]`)?.value ?? f.value;
      updateStatus();
      const link = document.querySelector(`.toc-link[href="#${CSS.escape(id)}"]`);
      if (link) link.classList.toggle('changed', f.value !== f.original);
      const tag = document.querySelector(`[data-field-id="${id}"]`)?.closest('.field-block')?.querySelector('.tag.changed, .tag:not(.readonly)');
      if (tag && !tag.classList.contains('readonly')) {
        tag.classList.toggle('changed', f.value !== f.original);
        tag.textContent = f.value !== f.original ? '已修改' : (f.meta.kind || '文字');
      }
    }

    function updateStatus() {
      const changed = [...fields.values()].filter((f) => f.value !== f.original).length;
      document.getElementById('status-changed').textContent = `已修改 ${changed} 處`;
      document.getElementById('status-bar').hidden = false;
    }

    function buildFieldBlock(id, label, kind, original, editable, isSub) {
      const block = document.createElement('div');
      block.className = 'field-block';
      block.id = id;

      const head = document.createElement('div');
      head.className = 'field-head';
      head.innerHTML = `
        <span class="label">${label}</span>
        <span class="tag ${editable ? '' : 'readonly'}">${editable ? kind : '僅預覽（含條件分支）'}</span>
        <a class="anchor-link" href="#${id}" title="複製此段連結">#連結</a>
      `;

      const ta = document.createElement('textarea');
      ta.className = 'field-input';
      ta.dataset.fieldId = id;
      ta.value = original;
      if (!editable) ta.readOnly = true;

      const tools = document.createElement('div');
      tools.className = 'field-tools';
      if (editable) {
        const btnPara = document.createElement('button');
        btnPara.type = 'button';
        btnPara.textContent = '插入段落空行';
        btnPara.title = '在游標處插入兩個換行（遊戲內段落間距）';
        btnPara.addEventListener('click', () => {
          insertAtCursor(ta, '\n\n');
          ta.dispatchEvent(new Event('input'));
        });
        const btnBr = document.createElement('button');
        btnBr.type = 'button';
        btnBr.textContent = '插入單行換行';
        btnBr.addEventListener('click', () => {
          insertAtCursor(ta, '\n');
          ta.dispatchEvent(new Event('input'));
        });
        tools.append(btnPara, btnBr);
      }

      const preview = renderPreview(original, isSub);
      preview.dataset.previewFor = id;

      ta.addEventListener('input', () => {
        fields.get(id).value = ta.value;
        preview.textContent = ta.value || '（空白）';
        preview.classList.toggle('empty', !ta.value);
        markChanged(id);
      });

      block.append(head, ta, tools, preview);
      return block;
    }

    function insertAtCursor(el, text) {
      const start = el.selectionStart;
      const end = el.selectionEnd;
      const val = el.value;
      el.value = val.slice(0, start) + text + val.slice(end);
      el.selectionStart = el.selectionEnd = start + text.length;
      el.focus();
    }

    function buildTocEntry(id, label) {
      const a = document.createElement('a');
      a.className = 'toc-link';
      a.href = `#${id}`;
      a.textContent = label;
      a.addEventListener('click', () => {
        document.querySelectorAll('.toc-link').forEach((l) => l.classList.remove('active'));
        a.classList.add('active');
      });
      return a;
    }

    function groupScenesByDay() {
      const groups = new Map();
      Object.values(SCENES).forEach((scene) => {
        const day = scene.isEpilogue ? '結語' : `Day ${scene.day ?? '?'}`;
        if (!groups.has(day)) groups.set(day, []);
        groups.get(day).push(scene);
      });
      return groups;
    }

      // —— 場景 ——

          `;

          const textOriginal = resolveValue(scene.text);
          const hasComplexText = typeof scene.text === 'function' && isComplexFunction(scene.text)
            && appendComplexTextFields(section, dayDiv, blockId, scene);
          if (!hasComplexText) {
            const textEditable = typeof scene.text !== 'function' || !isComplexFunction(scene.text);
            const textFid = registerField(fieldId(blockId, 'text'), 'scenes.js', textOriginal, { sceneId: scene.id, prop: 'text', fn: scene.text });
            section.appendChild(buildFieldBlock(textFid, '主敘事 text', '主敘事', textOriginal, textEditable, false));
            dayDiv.appendChild(buildTocEntry(textFid, `　↳ 主敘事`));
          } else {
            dayDiv.appendChild(buildTocEntry(blockId, `　↳ 主敘事（分支）`));

          section.appendChild(buildFieldBlock(subFid, '副標 sub', '副標', subOriginal, subEditable, true));

          if (scene.smell) {

            const saLabel = smellAddIsArray ? '氣味追加 smellAdd（陣列，以頓號分隔）' : '氣味追加 smellAdd';
            section.appendChild(buildFieldBlock(saFid, saLabel, '氣味', smellAddVal, true, false));

            section.appendChild(buildFieldBlock(cFid, `選項 ${ci + 1}`, '選項', choice.text, true, false));

      const crGroup = document.createElement('div');

      crGroup.innerHTML = '<div class="toc-group-title">選項反應</div>';
      toc.appendChild(crGroup);

      const crSection = document.createElement('section');
      crSection.className = 'scene-block';
      crSection.id = 'choice-reactions';
      crSection.innerHTML = '<h3>選項反應 CHOICE_REACTIONS</h3><div class="scene-meta">狗狗對各選項的行為描述</div>';

            mgSection.appendChild(buildFieldBlock(fid, `${game} · ${tier} · ${prop}`, prop, resolveValue(outcome[prop]), true, false));
            mgGroup.appendChild(buildTocEntry(fid, `${game}/${tier}`));
          });
        });
      });

      // —— 日記 ——
      const alGroup = document.createElement('div');
      alGroup.className = 'toc-group';
      alGroup.innerHTML = '<div class="toc-group-title">手繪日記</div>';
      toc.appendChild(alGroup);

      const alSection = document.createElement('section');
      alSection.className = 'scene-block';
      alSection.id = 'album-entries';
      alSection.innerHTML = '<h3>手繪日記 ALBUM_ENTRIES</h3>';
      content.appendChild(alSection);

      Object.entries(ALBUM_ENTRIES).forEach(([memId, entry]) => {
        ['title', 'desc'].forEach((prop) => {
          const fid = registerField(fieldId('album', memId, prop), 'systems.js', entry[prop], { memId, prop });
          alSection.appendChild(buildFieldBlock(fid, `${memId} · ${prop}`, '日記', entry[prop], true, prop === 'desc'));
          alGroup.appendChild(buildTocEntry(fid, `${entry.title}`));
        });
      });

      setupTocSearch();
      if (location.hash) {
        const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        target?.scrollIntoView({ behavior: 'smooth' });
      }
      updateStatus();
    }

    function refreshDynamicFields() {
      Object.values(SCENES).forEach((scene) => {
        const blockId = fieldId('scene', scene.id);
        const textFid = fieldId(blockId, 'text');
        const subFid = fieldId(blockId, 'sub');
        [textFid, subFid].forEach((fid) => {
          const f = fields.get(fid);
          if (!f || f.meta.fn) {
            const prop = fid.endsWith('sub') ? 'sub' : 'text';
            const val = resolveValue(scene[prop]);
            const ta = document.querySelector(`[data-field-id="${fid}"]`);
            const preview = document.querySelector(`[data-preview-for="${fid}"]`);
            if (ta && ta.readOnly) {
              ta.value = val;
              if (preview) preview.textContent = val || '（空白）';
              f.original = val;
              f.value = val;
            }
          }
        });
      });
      updateStatus();
    }

    function setupTocSearch() {
      const input = document.getElementById('toc-search');
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        document.querySelectorAll('.toc-link').forEach((link) => {
          const id = link.getAttribute('href').slice(1);
          const field = fields.get(id);
          const sceneEl = document.getElementById(id);
          const text = (field?.value || sceneEl?.textContent || link.textContent || '').toLowerCase();
          link.style.display = !q || text.includes(q) || id.includes(q) ? '' : 'none';
        });
      });
    }

    async function loadSourceFiles() {
      const names = ['scenes.js', 'choice-reactions.js', 'minigame-reactions.js', 'systems.js'];
      await Promise.all(names.map(async (name) => {
        const res = await fetch(`js/${name}?t=${Date.now()}`);
        sourceFiles[name] = await res.text();
      }));
    }

    function buildSaveEdits(edits) {
      const payload = [];
      const skipIds = new Set();
      const complexSceneIds = new Set(
        edits.filter((f) => f.meta.isComplexText).map((f) => f.meta.complexScene),
      );

      complexSceneIds.forEach((sceneId) => {
        if (!complexTextHasChanges(sceneId)) return;
        const parts = gatherComplexTextParts(sceneId);
        if (!COMPLEX_TEXT[sceneId] && parts.__fn__ == null) return;
        const fnBody = buildComplexTextFunction(sceneId, parts);
        if (!fnBody) return;
        edits.forEach((f) => {
          if (f.meta.complexScene === sceneId) skipIds.add(f.id);
        });
        payload.push({
          id: fieldId('scene', sceneId, 'text', 'fn'),
          file: 'scenes.js',
          sourceText: fnBody,
          useTemplate: false,
          meta: { sceneId, prop: 'text', isTextFunction: true },
        });
      });

      edits.forEach((f) => {
        if (skipIds.has(f.id)) return;
        const sourceText = displayToSource(f.value, PREVIEW_STATE);
        const useTemplate = needsTemplate(sourceText);
        const item = {
          id: f.id,
          file: f.file,
          sourceText,
          useTemplate,
          meta: { ...f.meta },
        };
        if (f.meta.prop === 'choice') {
          const oldKey = `${f.meta.sceneId}::${f.meta.oldChoiceText}`;
          const newKey = `${f.meta.sceneId}::${f.value}`;
          if (CHOICE_REACTIONS[oldKey] && oldKey !== newKey) {
            item.meta.newChoiceKey = newKey;
          }
        }
        payload.push(item);
      });
      return payload;
    }

    function collectEdits() {
      document.querySelectorAll('[data-field-id]').forEach((ta) => {
        const f = fields.get(ta.dataset.fieldId);
        if (f) f.value = ta.value;
      });
      return [...fields.values()].filter((f) => f.value !== f.original);
    }

    function saveDraft() {
      const data = {};
      fields.forEach((f, id) => { data[id] = f.value; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: Date.now(), values: data }));
      document.getElementById('status-draft').textContent = `草稿已存 ${new Date().toLocaleString()}`;
    }

    function loadDraft() {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) { alert('沒有草稿'); return; }
      const { values } = JSON.parse(raw);
      Object.entries(values).forEach(([id, val]) => {
        const f = fields.get(id);
        const ta = document.querySelector(`[data-field-id="${id}"]`);
        if (f && ta) {
          f.value = val;
          ta.value = val;
          ta.dispatchEvent(new Event('input'));
        }
      });
      document.getElementById('status-draft').textContent = '已載入草稿';
    }

    async function waitSaveResult(resultPort, attempts = 40) {
      const url = `http://127.0.0.1:${resultPort}/api/save-result`;
      for (let i = 0; i < attempts; i++) {
        await new Promise((r) => setTimeout(r, 250));
        try {
          const res = await fetch(url);
          if (res.ok) return res.json();
          if (res.status !== 404) break;
        } catch {
          /* 伺服器關閉中，等待寫入程序 */
        }
      }
      throw new Error('寫入逾時：請雙擊「啟動編輯器.bat」後檢查 js/ 是否已更新');
    }

    async function savePatchedJs() {
      const edits = collectEdits();
      if (!edits.length) { alert('沒有修改'); return; }

      const complexSceneIds = new Set(
        edits.filter((f) => f.meta.isComplexText).map((f) => f.meta.complexScene),
      );

      await checkEditorApi();
      if (!serverCanSave) {
        alert(
          '無法連線到編輯器伺服器。\n\n' +
          '請關閉舊的 python 程序，然後雙擊 Demo 資料夾內的「啟動編輯器.bat」。\n' +
          '瀏覽器應開啟：http://127.0.0.1:8765/game_editor.html',
        );
        return;
      }

      const btn = document.getElementById('btn-save-js');
      btn.disabled = true;
      btn.textContent = '關閉伺服器並儲存…';
      try {
        const res = await fetch(`${apiBase()}/api/save-js`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ edits: buildSaveEdits(edits) }),
        });
        const accepted = await res.json().catch(() => ({}));
        if (!res.ok || !accepted.ok) {
          throw new Error(accepted.error || `儲存失敗 (${res.status})`);
        }

        serverCanSave = false;
        document.getElementById('status-draft').textContent = '伺服器已關閉，正在寫入遊戲檔案…';

        const data = await waitSaveResult(accepted.resultPort || RESULT_PORT);
        if (!data.ok) {
          const failed = data.failed?.length ? `\n失敗：${data.failed.join('、')}` : '';
          throw new Error((data.error || '寫入失敗') + failed);
        }

        edits.forEach((f) => {
          if (f.meta.prop === 'choice') f.meta.oldChoiceText = f.value;
          f.original = f.value;
        });
        complexSceneIds.forEach((sceneId) => {
          fields.forEach((f) => {
            if (f.meta.complexScene === sceneId) f.original = f.value;
          });
        });
        document.querySelectorAll('.toc-link.changed').forEach((l) => l.classList.remove('changed'));
        document.querySelectorAll('.tag.changed').forEach((t) => t.classList.remove('changed'));
        updateStatus();
        localStorage.removeItem(DRAFT_KEY);

        document.getElementById('status-draft').textContent = '已寫入，正在重啟伺服器…';
        await waitServerBack();

        const warn = data.failed?.length ? `\n\n部分欄位未寫入：${data.failed.join('、')}` : '';
        alert(
          `已儲存到 Demo/js/\n${data.saved.join('\n')}${warn}\n\n` +
          '可繼續編輯，或執行「開啟遊戲.bat」玩遊戲。',
        );
      } catch (err) {
        alert(`無法寫入遊戲檔案：${err.message}`);
        await waitServerBack();
      } finally {
        btn.disabled = false;
        btn.textContent = '儲存到遊戲檔案';
      }
    }

    async function loadScriptFromServer(path) {
      const url = `${apiBase()}/${path}?v=${Date.now()}`;
      await new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = url;
        el.onload = () => resolve();
        el.onerror = () => reject(new Error(`${path} 載入失敗`));
        document.head.appendChild(el);
      });
    }

    async function loadGameData() {
      const files = [
        'js/systems.js',
        'js/scenes.js',
        'js/choice-reactions.js',
        'js/minigame-reactions.js',
      ];
      for (const file of files) {
        await loadScriptFromServer(file);
      }
    }

    async function tryRedirectFromFile() {
      if (location.protocol !== 'file:') return false;
      try {
        const res = await fetch(`http://127.0.0.1:${API_PORT}/api/editor`, { cache: 'no-store' });
        if (res.ok) {
          location.replace(`http://127.0.0.1:${API_PORT}/game_editor.html`);
          return true;
        }
      } catch { /* 伺服器未啟動 */ }
      return false;
    }

    function showLoadError(msg) {
      document.getElementById('content').innerHTML = `<div class="load-error">${msg}</div>`;
    }

    async function init() {
      if (await tryRedirectFromFile()) return;

      const placeholder = document.getElementById('load-placeholder');
      if (placeholder) placeholder.textContent = '正在從伺服器載入遊戲資料…';

      try {
        await checkEditorApi();
        if (!serverCanSave) {
          showLoadError(
            '無法連線到編輯器伺服器。<br><br>' +
            '1. 工作管理員結束所有 <code>python.exe</code><br>' +
            '2. 雙擊 <strong>Demo/啟動編輯器.bat</strong><br>' +
            '3. 確認瀏覽器網址為 <code>http://127.0.0.1:8765/game_editor.html</code>',
          );
          return;
        }
        await loadGameData();
      } catch (err) {
        showLoadError(
          `無法載入遊戲資料：${err.message}<br><br>` +
          '請雙擊 <strong>啟動編輯器.bat</strong> 後，用 ' +
          '<code>http://127.0.0.1:8765/game_editor.html</code> 開啟。',
        );
        return;
      }

      if (typeof SCENES === 'undefined') {
        showLoadError(
          'scenes.js 語法錯誤或載入失敗。<br><br>' +
          '若曾用編輯器儲存過，請在終端執行：<br>' +
          '<code>git checkout -- Demo/js/scenes.js</code><br><br>' +
          '然後重新執行「啟動編輯器.bat」。',
        );
        return;
      }

      placeholder?.remove();
      try { await loadSourceFiles(); } catch { /* 儲存時伺服器會讀檔 */ }
      buildEditor();
      const draft = localStorage.getItem(DRAFT_KEY);
      if (draft) {
        const statusEl = document.getElementById('status-draft');
        statusEl.textContent += (statusEl.textContent ? ' · ' : '') + '有未載入的草稿';
      }
    }

    document.getElementById('btn-reload').addEventListener('click', () => location.reload());
    document.getElementById('btn-reconnect').addEventListener('click', async () => {
      const ok = await checkEditorApi();
      alert(ok ? '已連線，可以儲存。' : '仍無法連線。請雙擊「啟動編輯器.bat」。');
    });
    document.getElementById('btn-draft-save').addEventListener('click', saveDraft);
    document.getElementById('btn-draft-load').addEventListener('click', loadDraft);
    document.getElementById('btn-save-js').addEventListener('click', savePatchedJs);

    init();
  </script>
</body>
</html>
